name: Publish to PyPI

# Triggered by pushing a version tag (e.g. `v0.1.0`) — not on every push, so a
# release is a deliberate act. CI builds and publishes only; it does not run the tests,
# because the test data (tests/fixtures/*.json) is not in the repository. The
# maintainer runs the full suite locally before tagging.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing — no token secret involved
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish
